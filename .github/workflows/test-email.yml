name: Test email delivery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: email-test
  cancel-in-progress: false

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send a test email through Gmail SMTP
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import smtplib
          import ssl
          from datetime import datetime, timezone
          from email.message import EmailMessage

          required = ("SMTP_USERNAME", "SMTP_APP_PASSWORD", "REPORT_RECIPIENT")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(
                  "Missing GitHub Actions secrets: " + ", ".join(missing)
                  + ". Add them in Settings > Secrets and variables > Actions."
              )

          sender = os.environ["SMTP_USERNAME"].strip()
          recipient = os.environ["REPORT_RECIPIENT"].strip()
          password = os.environ["SMTP_APP_PASSWORD"].replace(" ", "")

          message = EmailMessage()
          message["Subject"] = "[Market Intelligence] Test de réception"
          message["From"] = sender
          message["To"] = recipient
          message.set_content(
              "Ceci est un e-mail de test envoyé par GitHub Actions via Gmail SMTP.\n\n"
              "Si tu reçois ce message, la configuration d'envoi fonctionne. "
              "Les rapports de marché programmés ne sont pas encore activés : "
              "le moteur d'analyse et ses contrôles doivent être installés et testés "
              "avant l'envoi automatique.\n\n"
              "Heure UTC du test : "
              + datetime.now(timezone.utc).isoformat(timespec="seconds")
              + "\n"
          )

          context = ssl.create_default_context()
          with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as server:
              server.ehlo()
              server.starttls(context=context)
              server.ehlo()
              server.login(sender, password)
              server.send_message(message)

          print("Test email sent successfully.")
          PY