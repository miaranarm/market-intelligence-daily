name: Generate market report

on:
  # Madagascar (UTC+3): 05:30, 13:30, 21:00
  schedule:
    - cron: "30 2 * * 1-5"  # 05:30 Madagascar, Monday-Friday
    - cron: "30 10 * * 1-5" # 13:30 Madagascar, Monday-Friday
    - cron: "0 18 * * 1-5"  # 21:00 Madagascar, Monday-Friday
    - cron: "0 15 * * 0"    # 18:00 Madagascar, Sunday weekly outlook
  workflow_dispatch:
    inputs:
      report_type:
        description: "Type de rapport à générer"
        required: true
        default: morning
        type: choice
        options:
          - morning
          - update
          - audit
          - weekly
  # ChatGPT can trigger a run by posting a command on the control issue.
  # Only comments authored by the repository owner with an exact command are accepted.
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

concurrency:
  group: market-report
  cancel-in-progress: false

jobs:
  report:
    if: ${{ github.event_name != 'issue_comment' || (github.event.comment.user.login == 'miaranarm' && !github.event.issue.pull_request && contains(fromJSON('["/run-market-report morning","/run-market-report update","/run-market-report audit","/run-market-report weekly"]'), github.event.comment.body)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile all project Python files and run tests
        run: |
          python -m compileall -q src tests tools
          python -m unittest discover -s tests -v
          python -m unittest src.test_enrichment src.test_pipeline -v

      - name: Determine report type
        id: report_type
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_INPUT: ${{ inputs.report_type }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            case "$COMMENT_BODY" in
              "/run-market-report morning") type="morning" ;;
              "/run-market-report update") type="update" ;;
              "/run-market-report audit") type="audit" ;;
              "/run-market-report weekly") type="weekly" ;;
              *) echo "Unsupported command"; exit 1 ;;
            esac
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            case "$SCHEDULE" in
              "30 2 * * 1-5") type="morning" ;;
              "30 10 * * 1-5") type="update" ;;
              "0 18 * * 1-5") type="audit" ;;
              "0 15 * * 0") type="weekly" ;;
              *) echo "Unsupported schedule"; exit 1 ;;
            esac
          else
            type="${DISPATCH_INPUT:-morning}"
          fi
          echo "value=$type" >> "$GITHUB_OUTPUT"
          echo "Report type selected: $type"

      - name: Generate report files
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
          REPORT_TYPE: ${{ steps.report_type.outputs.value }}
          # Enable the existing, fact-constrained editorial layer when its API key is configured.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python src/market_report.py --report-type "$REPORT_TYPE" --no-email

      - name: Commit report history
        env:
          REPORT_TYPE: ${{ steps.report_type.outputs.value }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No report state changes to commit."
            exit 0
          fi
          git commit -m "Record market report snapshot"
          # If main advanced while data were being collected, regenerate on top of the latest
          # history instead of trying to merge two independently generated snapshots.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Report commit conflicted or push raced; rebuilding on latest main (attempt $attempt/3)."
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python src/market_report.py --report-type "$REPORT_TYPE" --no-email
            git add data/ docs/
            if ! git diff --cached --quiet; then
              git commit -m "Record market report snapshot (rebuilt on latest main)"
            else
              echo "Regenerated report has no state changes."
              exit 0
            fi
          done
          echo "Unable to publish report after three attempts."
          exit 1

      - name: Email the public report link
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
          REPORT_TYPE: ${{ steps.report_type.outputs.value }}
        run: python src/market_report.py --report-type "$REPORT_TYPE" --send-link-only
