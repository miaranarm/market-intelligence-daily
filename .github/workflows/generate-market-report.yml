name: Generate market report

on:
  # Madagascar (UTC+3): 05:30, 13:30, 21:00
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 10 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      report_type:
        description: "Type de rapport à générer"
        required: true
        default: morning
        type: choice
        options:
          - morning
          - update
          - audit
  # ChatGPT can trigger a run by posting a command on the control issue.
  # Only comments authored by the repository owner with an exact command are accepted.
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: read

concurrency:
  group: market-report
  cancel-in-progress: false

jobs:
  report:
    if: ${{ github.event_name != 'issue_comment' || (github.event.comment.user.login == 'miaranarm' && !github.event.issue.pull_request && contains(fromJSON('["/run-market-report morning","/run-market-report update","/run-market-report audit"]'), github.event.comment.body)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate Python syntax and self-audit tests
        run: |
          python -m py_compile src/market_report.py
          python -m unittest discover -s tests -v

      - name: Determine report type
        id: report_type
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_INPUT: ${{ inputs.report_type }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            case "$COMMENT_BODY" in
              "/run-market-report morning") type="morning" ;;
              "/run-market-report update") type="update" ;;
              "/run-market-report audit") type="audit" ;;
              *) echo "Unsupported command"; exit 1 ;;
            esac
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            case "$SCHEDULE" in
              "30 2 * * *") type="morning" ;;
              "30 10 * * *") type="update" ;;
              "0 18 * * *") type="audit" ;;
              *) echo "Unsupported schedule"; exit 1 ;;
            esac
          else
            type="${DISPATCH_INPUT:-morning}"
          fi
          echo "value=$type" >> "$GITHUB_OUTPUT"
          echo "Report type selected: $type"

      - name: Generate report files
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
          REPORT_TYPE: ${{ steps.report_type.outputs.value }}
        run: python src/market_report.py --report-type "$REPORT_TYPE" --no-email

      - name: Commit report history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No report state changes to commit."
          else
            git commit -m "Record market report snapshot"
            # Rebase onto the latest main in case documentation or settings changed during generation.
            git pull --rebase origin main
            git push
          fi

      - name: Email the public report link
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
          REPORT_TYPE: ${{ steps.report_type.outputs.value }}
        run: python src/market_report.py --report-type "$REPORT_TYPE" --send-link-only
