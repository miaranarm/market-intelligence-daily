name: Generate market report

on:
  # Madagascar (UTC+3): 05:30, 13:30, 21:00
  schedule:
    - cron: "30 2 * * *"
    - cron: "30 10 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      report_type:
        description: "Type de rapport à générer"
        required: true
        default: morning
        type: choice
        options:
          - morning
          - update
          - audit

permissions:
  contents: write

concurrency:
  group: market-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate Python syntax and self-audit tests
        run: |
          python -m py_compile src/market_report.py
          python -m unittest discover -s tests -v

      - name: Generate report files
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
          REPORT_TYPE: ${{ github.event_name == 'schedule' && (github.event.schedule == '30 2 * * *' && 'morning' || github.event.schedule == '30 10 * * *' && 'update' || 'audit') || inputs.report_type || 'morning' }}
        run: python src/market_report.py --report-type "$REPORT_TYPE" --no-email

      - name: Commit report history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "No report state changes to commit."
          else
            git commit -m "Record market report snapshot"
            git push
          fi

      - name: Email the public report link
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}
          REPORT_TYPE: ${{ inputs.report_type }}
        run: python src/market_report.py --report-type "$REPORT_TYPE" --send-link-only
